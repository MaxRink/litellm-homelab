name: Publish homelab LiteLLM image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (defaults to the upstream release)
        required: false
        default: v1.110.3

permissions:
  contents: read

concurrency:
  group: publish-homelab-litellm
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push homelab image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve build metadata
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          test -n "$tag"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'image=ghcr.io/%s/litellm-homelab\n' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/homelab-v1103/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ github.sha }}

      - name: Record digest
        run: |
          digest="$(docker buildx imagetools inspect \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "Published ${{ steps.meta.outputs.image }}@${digest}" >> "$GITHUB_STEP_SUMMARY"
